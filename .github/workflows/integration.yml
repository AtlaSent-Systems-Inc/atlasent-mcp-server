name: Integration

on:
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-latest
    environment: integration
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:integration
        env:
          ATLASENT_API_KEY: ${{ secrets.ATLASENT_API_KEY }}
          ATLASENT_ANON_KEY: ${{ secrets.ATLASENT_ANON_KEY }}
          ATLASENT_BASE_URL: ${{ secrets.ATLASENT_BASE_URL }}
          # Sandbox-only opt-in for the policy + permit write-tool tests.
          # Without this secret, src/integration.write.test.ts skips and
          # no write operations run against the live API.
          ATLASENT_SANDBOX_ORG_ID: ${{ secrets.ATLASENT_SANDBOX_ORG_ID }}
