name: Publish to npm

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write   # cosign keyless OIDC
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Verify version tag matches package.json
        if: github.event_name == 'push'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${PKG_VERSION}"
            exit 1
          fi
          echo "Tag ${GITHUB_REF_NAME} matches package.json version ${PKG_VERSION}"

      # ── AtlaSent release gate ────────────────────────────────────────
      # Gate closed: if the permit is not verified the job exits here and
      # nothing builds or publishes.
      - name: AtlaSent release gate
        uses: atlasent-systems-inc/atlasent-action@v1
        env:
          ATLASENT_API_KEY: ${{ secrets.ATLASENT_API_KEY }}
        with:
          action: production.release
          actor: ${{ github.actor }}
          environment: production
          context: '{"ref": "${{ github.ref }}", "repo": "${{ github.repository }}"}'  

      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.4.1'

      - run: npm ci
      - run: npm run build
      - run: npm test

      - name: Pack tarball
        run: |
          npm pack
          PKG=$(ls *.tgz | head -1)
          echo "PKG=$PKG" >> "$GITHUB_ENV"

      - name: Sign tarball (cosign keyless)
        # Keyless OIDC cert via Sigstore Fulcio — no private key in secrets.
        run: cosign sign-blob --yes --bundle="${PKG}.bundle" "${PKG}"

      - name: Publish to npm
        # --provenance requires a public source repo; this repo is private.
        # cosign signing above covers supply-chain attestation.
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Upload cosign bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: cosign-bundle
          path: "*.bundle"
          if-no-files-found: error
