# Publish server.json to the official MCP Registry
# (registry.modelcontextprotocol.io) after each npm release.
#
# Runs when the "Publish to npm" workflow completes successfully (the
# registry validates that the npm package version exists, so it must run
# AFTER npm publish), or manually via workflow_dispatch for the first
# publication / a re-publish.
#
# Auth: GitHub OIDC — the io.github.atlasent-systems-inc/* namespace is
# owned by this org, so `mcp-publisher login github-oidc` needs no stored
# secret. Fail-closed: a version mismatch between server.json and
# package.json aborts before any publish.

name: Publish to MCP Registry

on:
  workflow_run:
    workflows: ["Publish to npm"]
    types: [completed]
  workflow_dispatch:

jobs:
  publish-registry:
    runs-on: ubuntu-latest
    # On workflow_run, only proceed if the npm publish succeeded.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      id-token: write   # GitHub OIDC login to the MCP registry
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@v7

      # ── AtlaSent publish gate ────────────────────────────────────────
      # Dogfooding fix: this workflow published server.json to the official
      # MCP Registry with no AtlaSent evaluate/permit gate at all. Running
      # automatically after "Publish to npm" succeeds does NOT inherit that
      # workflow's gate -- workflow_run is a separate execution context, and
      # workflow_dispatch here bypasses the upstream gate entirely. Found
      # during a dogfooding audit of consequential actions AtlaSent's own
      # coding agents can take against AtlaSent's own infrastructure.
      #
      # Same action type and api-url as the corrected publish.yml gate
      # (package.release, pointed directly at the runtime project) -- this is
      # the same category of action (publishing this package's identity to a
      # public registry), just a second registry.
      - name: AtlaSent publish gate
        id: atlasent_gate
        uses: atlasent-systems-inc/atlasent-action@v1
        env:
          ATLASENT_API_KEY: ${{ secrets.ATLASENT_API_KEY }}
        with:
          action: package.release
          actor: ${{ github.actor }}
          environment: production
          api-url: https://kttccumlnmdtupgbyfue.supabase.co/functions/v1
          context: '{"ref": "${{ github.ref }}", "repo": "${{ github.repository }}", "artifact": "mcp-registry"}'

      - name: Verify server.json version matches package.json
        run: |
          SRV=$(node -p "require('./server.json').version")
          SRV_PKG=$(node -p "require('./server.json').packages[0].version")
          PKG=$(node -p "require('./package.json').version")
          if [ "$SRV" != "$PKG" ] || [ "$SRV_PKG" != "$PKG" ]; then
            echo "::error::server.json version ($SRV / package entry $SRV_PKG) != package.json version ($PKG). Bump server.json in the release PR."
            exit 1
          fi
          echo "server.json and package.json agree on $PKG"

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher
          ./mcp-publisher --version

      - name: Login (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish
        run: ./mcp-publisher publish
